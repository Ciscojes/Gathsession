<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Gathsession: belleza y bienestar en un espacio pensado para ti."
    />

    <title>Gathsession | Belleza y bienestar</title>
  </head>

  <body>
    <header class="header">
      <div class="header__container container">
        <a href="#" class="header__brand">
          <img
            src="/brand/gathsession-logo.png"
            alt="GathSession"
            class="header__logo"
          />
        </a>

        <nav class="header__nav">
          <ul>
            <li>
              <a class="header__link header__link--active" href="#">Home</a>
            </li>

            <li>
              <a class="header__link" href="#">Features</a>
            </li>

            <li>
              <a class="header__link" href="#">Blog</a>
            </li>

            <li>
              <a class="header__link" href="#">Contact</a>
            </li>

            <li>
              <a class="header__link" href="#">About Us</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero container">
        <div class="hero__content">
          <h1 class="hero__title">
            Build your best community starting from here.
          </h1>
          <p class="hero__description">
            Meet and communicate with the best people to run projects, events or
            other activities in a more effective and fun way
          </p>
          <div class="hero__buttons">
            <a class="hero__button hero__button--primary" href="#">
              Get Started
            </a>
            <a class="hero__button hero__button--secondary" href="#">
              <span>Learn More</span>
              <span class="hero__arrow">
                <img src="/icons/arrow-right.svg" alt="" />
              </span>
            </a>
          </div>
        </div>

        <div class="hero__visual">
          <figure>
            <img src="/images/community-man-orange.png" alt="" />
            <img src="/images/community-man-purple.png" alt="" />
            <img src="/images/community-woman-glasses.png" alt="" />
            <img src="/images/community-woman-teal.png" alt="" />
            <img src="/images/community-woman-yellow.png" alt="" />
          </figure>
        </div>
      </section>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
